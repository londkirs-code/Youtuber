name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses

      - name: Preserve previous APK for update-signature verification
        shell: bash
        run: |
          set -euo pipefail
          if [ -s downloads/TuneVault.apk ]; then
            cp downloads/TuneVault.apk /tmp/TuneVault.previous.apk
          fi

      - name: Build matching FFmpeg and FFprobe 9.0.2 for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p app/src/main/assets/ffmpeg
          git clone --depth 1 --branch n9.0.2 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg-src
          cd /tmp/ffmpeg-src
          ./configure --prefix=/tmp/ffmpeg-install --target-os=android --arch=aarch64 --cpu=armv8-a --enable-cross-compile --sysroot="$TOOLCHAIN/sysroot" --cc="$TOOLCHAIN/bin/aarch64-linux-android24-clang" --cxx="$TOOLCHAIN/bin/aarch64-linux-android24-clang++" --ar="$TOOLCHAIN/bin/llvm-ar" --nm="$TOOLCHAIN/bin/llvm-nm" --ranlib="$TOOLCHAIN/bin/llvm-ranlib" --strip="$TOOLCHAIN/bin/llvm-strip" --disable-shared --enable-static --disable-doc --disable-debug --disable-ffplay --disable-autodetect --disable-network --enable-pic --enable-small --extra-cflags="-O2 -fPIC"
          make -j2 ffmpeg ffprobe
          cp ffmpeg "$GITHUB_WORKSPACE/app/src/main/assets/ffmpeg/ffmpeg"
          cp ffprobe "$GITHUB_WORKSPACE/app/src/main/assets/ffmpeg/ffprobe"
          cp COPYING.LGPLv2.1 "$GITHUB_WORKSPACE/app/src/main/assets/ffmpeg/LICENSE-LGPL-2.1.txt"
          cd "$GITHUB_WORKSPACE"
          chmod 755 app/src/main/assets/ffmpeg/ffmpeg app/src/main/assets/ffmpeg/ffprobe
          test -s app/src/main/assets/ffmpeg/ffmpeg
          test -s app/src/main/assets/ffmpeg/ffprobe
          test -s app/src/main/assets/ffmpeg/LICENSE-LGPL-2.1.txt
          test "$(stat -c %s app/src/main/assets/ffmpeg/ffmpeg)" -gt 1000000
          test "$(stat -c %s app/src/main/assets/ffmpeg/ffprobe)" -gt 1000000
          echo "Binary files copied and size checks passed."
          readelf -h app/src/main/assets/ffmpeg/ffmpeg | grep -q "AArch64"
          readelf -h app/src/main/assets/ffmpeg/ffprobe | grep -q "AArch64"
          echo "Both binaries are AArch64 ELF executables."
          if readelf -d app/src/main/assets/ffmpeg/ffmpeg | grep -E "libav(codec|format|util|filter).*\\.so"; then
            echo "FFmpeg must be self-contained; unexpected external FFmpeg shared-library dependency."
            exit 1
          fi
          file app/src/main/assets/ffmpeg/ffmpeg app/src/main/assets/ffmpeg/ffprobe
          ls -lh app/src/main/assets/ffmpeg/ffmpeg app/src/main/assets/ffmpeg/ffprobe
          echo "FFmpeg and FFprobe were built from the same upstream source tag for Android API 24 / arm64."

      - name: Verify Python build interpreter
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Smoke-test the APK and FFmpeg/FFprobe on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -n com.aistudio.tunevault.ytmpro/com.example.MainActivity
            sleep 25
            adb logcat -d | grep -F "Embedded engine ready:"
            adb shell run-as com.aistudio.tunevault.ytmpro sh -c 'R=no_backup/tunevault-runtime/ffmpeg; "$R/ffmpeg" -hide_banner -f lavfi -i sine=frequency=1000:duration=1 -c:a aac -b:a 64k -y files/tunevault-smoke.m4a'
            adb shell run-as com.aistudio.tunevault.ytmpro sh -c 'R=no_backup/tunevault-runtime/ffmpeg; "$R/ffprobe" -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 files/tunevault-smoke.m4a' | grep -E '^1\.'
            echo "Android runtime smoke test passed: app initialized, FFmpeg encoded audio, FFprobe read the output."

      - name: Verify APK engine payload and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/ffmpeg/ffmpeg"
          unzip -l "$APK" | grep -q "assets/ffmpeg/ffprobe"
          unzip -l "$APK" | grep -q "assets/ffmpeg/LICENSE-LGPL-2.1.txt"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libqjs.so"
          mkdir -p downloads
          cp "$APK" downloads/TuneVault.apk
          sha256sum downloads/TuneVault.apk | tee downloads/TuneVault.apk.sha256
          sha256sum -c downloads/TuneVault.apk.sha256

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose downloads/TuneVault.apk
          "$AAPT" dump badging downloads/TuneVault.apk | grep -q "versionCode='6' versionName='1.5'"
          if [ -s /tmp/TuneVault.previous.apk ]; then
            "$APKSIGNER" verify /tmp/TuneVault.previous.apk
            OLD_CERT="$("$APKSIGNER" verify --print-certs /tmp/TuneVault.previous.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
            NEW_CERT="$("$APKSIGNER" verify --print-certs downloads/TuneVault.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
            test -n "$OLD_CERT"
            test "$OLD_CERT" = "$NEW_CERT"
            OLD_VERSION_CODE="$("$AAPT" dump badging /tmp/TuneVault.previous.apk | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
            NEW_VERSION_CODE="$("$AAPT" dump badging downloads/TuneVault.apk | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
            test "$NEW_VERSION_CODE" -gt "$OLD_VERSION_CODE"
            echo "Update signer and versionCode are compatible with the previously published APK."
          fi

      - name: Publish APK to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/tunevault-new-publish
          cp downloads/TuneVault.apk /tmp/tunevault-new-publish/TuneVault.apk
          cp downloads/TuneVault.apk.sha256 /tmp/tunevault-new-publish/TuneVault.apk.sha256
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp /tmp/tunevault-new-publish/TuneVault.apk downloads/TuneVault.apk
          cp /tmp/tunevault-new-publish/TuneVault.apk.sha256 downloads/TuneVault.apk.sha256
          git add downloads/TuneVault.apk downloads/TuneVault.apk.sha256
          if git diff --cached --quiet; then
            echo "APK contents unchanged; no repository commit needed."
          else
            git commit -m "Publish latest TuneVault APK"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git show "origin/${GITHUB_REF_NAME}:downloads/TuneVault.apk" > /tmp/TuneVault.published.apk
          git show "origin/${GITHUB_REF_NAME}:downloads/TuneVault.apk.sha256" > /tmp/TuneVault.published.apk.sha256
          test -s /tmp/TuneVault.published.apk
          cmp downloads/TuneVault.apk /tmp/TuneVault.published.apk
          EXPECTED_SHA="$(awk '{print $1}' /tmp/TuneVault.published.apk.sha256)"
          ACTUAL_SHA="$(sha256sum /tmp/TuneVault.published.apk | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose /tmp/TuneVault.published.apk
          echo "Verified: APK and SHA-256 are present on origin/${GITHUB_REF_NAME}"
