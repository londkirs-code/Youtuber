name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export Python 3.11 interpreter for Chaquopy
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -c "import sys; print('BUILD_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Preserve latest published APK and select next versionCode
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          if git cat-file -e "origin/$GITHUB_REF_NAME:downloads/TuneVault.apk" 2>/dev/null; then
            git show "origin/$GITHUB_REF_NAME:downloads/TuneVault.apk" > /tmp/TuneVault.previous.apk
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          if [ -s /tmp/TuneVault.previous.apk ]; then
            OLD_VERSION_CODE="$("$AAPT" dump badging /tmp/TuneVault.previous.apk | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")"
            if [ -z "$OLD_VERSION_CODE" ]; then
              echo "::error::Could not read versionCode from the previously published APK."
              exit 1
            fi
            BUILD_VERSION_CODE=$((OLD_VERSION_CODE + 1))
          else
            BUILD_VERSION_CODE=8
          fi
          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Next TuneVault versionCode: $BUILD_VERSION_CODE"

      - name: Build matching FFmpeg and FFprobe 9.0.2 for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/ffmpeg
          git clone --depth 1 --branch n9.0.2 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg-src
          cd /tmp/ffmpeg-src
          ./configure --prefix=/tmp/ffmpeg-install --target-os=android --arch=aarch64 --cpu=armv8-a --enable-cross-compile --sysroot="$TOOLCHAIN/sysroot" --cc="$TOOLCHAIN/bin/aarch64-linux-android24-clang" --cxx="$TOOLCHAIN/bin/aarch64-linux-android24-clang++" --ar="$TOOLCHAIN/bin/llvm-ar" --nm="$TOOLCHAIN/bin/llvm-nm" --ranlib="$TOOLCHAIN/bin/llvm-ranlib" --strip="$TOOLCHAIN/bin/llvm-strip" --disable-shared --enable-static --disable-doc --disable-debug --disable-ffplay --disable-autodetect --disable-network --enable-pic --enable-small --extra-cflags="-O2 -fPIC" --extra-ldflags="-Wl,-z,max-page-size=16384"
          make -j2 ffmpeg ffprobe
          cp ffmpeg "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libffmpeg.so"
          cp ffprobe "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libffprobe.so"
          cp COPYING.LGPLv2.1 "$GITHUB_WORKSPACE/app/src/main/assets/ffmpeg/LICENSE-LGPL-2.1.txt"
          cd "$GITHUB_WORKSPACE"
          chmod 755 app/src/main/jniLibs/arm64-v8a/libffmpeg.so app/src/main/jniLibs/arm64-v8a/libffprobe.so
          test -s app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          test -s app/src/main/jniLibs/arm64-v8a/libffprobe.so
          test -s app/src/main/assets/ffmpeg/LICENSE-LGPL-2.1.txt
          test "$(stat -c %s app/src/main/jniLibs/arm64-v8a/libffmpeg.so)" -gt 1000000
          test "$(stat -c %s app/src/main/jniLibs/arm64-v8a/libffprobe.so)" -gt 1000000
          readelf -h app/src/main/jniLibs/arm64-v8a/libffmpeg.so | grep -q "AArch64"
          readelf -h app/src/main/jniLibs/arm64-v8a/libffprobe.so | grep -q "AArch64"
          file app/src/main/jniLibs/arm64-v8a/libffmpeg.so app/src/main/jniLibs/arm64-v8a/libffprobe.so
          echo "FFmpeg and FFprobe were built from the same upstream source tag for Android API 24 / arm64."

      - name: Verify no legacy youtubedl-android source references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=build "yausername" app/src; then
            echo "::error::Legacy youtubedl-android references remain under app/src."
            exit 1
          fi
          echo "Verified: zero yausername references under app/src."

      - name: Verify Python build interpreter
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version; print(sys.executable)"

      - name: Verify existing repository debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "The existing TuneVault signing key is present and its original alias/password are valid."

      - name: Build Debug APK using the existing TuneVault signing key
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK engine payload and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libffmpeg.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libffprobe.so"
          unzip -l "$APK" | grep -q "assets/ffmpeg/LICENSE-LGPL-2.1.txt"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libqjs.so"
          mkdir -p downloads
          cp "$APK" downloads/TuneVault.apk
          sha256sum downloads/TuneVault.apk | tee downloads/TuneVault.apk.sha256
          sha256sum -c downloads/TuneVault.apk.sha256

      - name: Verify APK signature and update compatibility
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose downloads/TuneVault.apk
          "$AAPT" dump badging downloads/TuneVault.apk | grep -q "versionCode='$BUILD_VERSION_CODE' versionName='1.7'"
          if [ -s /tmp/TuneVault.previous.apk ]; then
            "$APKSIGNER" verify /tmp/TuneVault.previous.apk
            OLD_CERT="$("$APKSIGNER" verify --print-certs /tmp/TuneVault.previous.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
            NEW_CERT="$("$APKSIGNER" verify --print-certs downloads/TuneVault.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
            test -n "$OLD_CERT"
            test "$OLD_CERT" = "$NEW_CERT"
            OLD_VERSION_CODE="$("$AAPT" dump badging /tmp/TuneVault.previous.apk | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")"
            NEW_VERSION_CODE="$("$AAPT" dump badging downloads/TuneVault.apk | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")"
            test "$NEW_VERSION_CODE" -gt "$OLD_VERSION_CODE"
            echo "Existing signing certificate and increasing versionCode are compatible with the previous APK."
          fi

      - name: Publish APK to repository
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/tunevault-new-publish
          cp downloads/TuneVault.apk /tmp/tunevault-new-publish/TuneVault.apk
          cp downloads/TuneVault.apk.sha256 /tmp/tunevault-new-publish/TuneVault.apk.sha256
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp /tmp/tunevault-new-publish/TuneVault.apk downloads/TuneVault.apk
          cp /tmp/tunevault-new-publish/TuneVault.apk.sha256 downloads/TuneVault.apk.sha256
          git add downloads/TuneVault.apk downloads/TuneVault.apk.sha256
          if git diff --cached --quiet; then
            echo "APK contents unchanged; no repository commit needed."
          else
            git commit -m "Publish latest TuneVault APK v1.7 (code $BUILD_VERSION_CODE)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          git fetch origin "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git show "origin/$GITHUB_REF_NAME:downloads/TuneVault.apk" > /tmp/TuneVault.published.apk
          git show "origin/$GITHUB_REF_NAME:downloads/TuneVault.apk.sha256" > /tmp/TuneVault.published.apk.sha256
          test -s /tmp/TuneVault.published.apk
          cmp downloads/TuneVault.apk /tmp/TuneVault.published.apk
          EXPECTED_SHA="$(awk '{print $1}' /tmp/TuneVault.published.apk.sha256)"
          ACTUAL_SHA="$(sha256sum /tmp/TuneVault.published.apk | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          "$APKSIGNER" verify --verbose /tmp/TuneVault.published.apk
          echo "Verified: APK and SHA-256 are present on origin/$GITHUB_REF_NAME"

# Manual rebuild after launcher icon update on 2026-11-02; keep this workflow eligible for push-triggered builds.
