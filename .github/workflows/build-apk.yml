name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.14 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Download and verify FFmpeg 9.0.2 for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffmpeg-unpack app/src/main/assets/ffmpeg
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-arm64.zip" \
            -o /tmp/ffmpeg-android-arm64.zip
          echo "5557b6538846b73f95f28ae8a3b2b19499d5d5f42021ce2458f5c7add553b6fe  /tmp/ffmpeg-android-arm64.zip" | sha256sum -c -
          unzip -q /tmp/ffmpeg-android-arm64.zip -d /tmp/ffmpeg-unpack
          FFMPEG="$(find /tmp/ffmpeg-unpack -type f -name ffmpeg -print -quit)"
          FFPROBE="$(find /tmp/ffmpeg-unpack -type f -name ffprobe -print -quit)"
          test -n "$FFMPEG"
          test -n "$FFPROBE"
          test -s "$FFMPEG"
          test -s "$FFPROBE"
          cp "$FFMPEG" app/src/main/assets/ffmpeg/ffmpeg
          cp "$FFPROBE" app/src/main/assets/ffmpeg/ffprobe
          chmod 755 app/src/main/assets/ffmpeg/ffmpeg app/src/main/assets/ffmpeg/ffprobe
          file app/src/main/assets/ffmpeg/ffmpeg app/src/main/assets/ffmpeg/ffprobe
          readelf -h app/src/main/assets/ffmpeg/ffmpeg | grep -q "AArch64"
          readelf -h app/src/main/assets/ffmpeg/ffprobe | grep -q "AArch64"
          echo "FFmpeg 9.0.2 Android arm64 binaries verified by SHA-256 and ELF architecture."

      - name: Verify Python build interpreter
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK engine payload and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/ffmpeg/ffmpeg"
          unzip -l "$APK" | grep -q "assets/ffmpeg/ffprobe"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libqjs.so"
          mkdir -p downloads
          cp "$APK" downloads/TuneVault.apk
          sha256sum downloads/TuneVault.apk | tee downloads/TuneVault.apk.sha256
          sha256sum -c downloads/TuneVault.apk.sha256

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose downloads/TuneVault.apk

      - name: Publish APK to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/TuneVault.apk downloads/TuneVault.apk.sha256
          if git diff --cached --quiet; then
            echo "APK contents unchanged; no repository commit needed."
          else
            git commit -m "Publish latest TuneVault APK"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git show "origin/${GITHUB_REF_NAME}:downloads/TuneVault.apk" > /tmp/TuneVault.published.apk
          git show "origin/${GITHUB_REF_NAME}:downloads/TuneVault.apk.sha256" > /tmp/TuneVault.published.apk.sha256
          test -s /tmp/TuneVault.published.apk
          cmp downloads/TuneVault.apk /tmp/TuneVault.published.apk
          EXPECTED_SHA="$(awk '{print $1}' /tmp/TuneVault.published.apk.sha256)"
          ACTUAL_SHA="$(sha256sum /tmp/TuneVault.published.apk | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose /tmp/TuneVault.published.apk
          echo "Verified: APK and SHA-256 are present on origin/${GITHUB_REF_NAME}"
